  <script>
    const tl = gsap.timeline({ paused: true });
    // Hook: the line is the first thing on screen
    tl.fromTo(["#hk-w1", "#hk-w2", "#hk-w3"], { opacity: 1, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.1 }, 0);
    tl.fromTo("#hk-clock", { opacity: 1, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 0);
    // Countdown arc drains while the minute hand spins
    tl.to("#hk-arc", { strokeDashoffset: 528, duration: 5.2, ease: "none" }, 0.2);
    tl.to("#hk-hand-m", { rotation: 1800, svgOrigin: "100 108", duration: 5.2, ease: "none" }, 0.2);
    tl.to("#hk-hand-h", { rotation: 150, svgOrigin: "100 108", duration: 5.2, ease: "none" }, 0.2);
    // Alarm shakes in three bursts, with a flat red flash
    [1.0, 2.6, 4.2].forEach((t0) => {
      for (let i = 0; i < 8; i++) {
        tl.to("#hk-clock-body", { rotation: i % 2 ? -4 : 4, svgOrigin: "100 108", duration: 0.07, ease: "sine.inOut" }, t0 + i * 0.075);
      }
      tl.to("#hk-clock-body", { rotation: 0, svgOrigin: "100 108", duration: 0.1 }, t0 + 0.6);
      tl.to("#hk-tint", { opacity: 0.22, duration: 0.1 }, t0);
      tl.to("#hk-tint", { opacity: 0, duration: 0.4 }, t0 + 0.12);
    });
    // Second line
    tl.fromTo("#hk-miss", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 1.2);
    tl.fromTo("#hk-three", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.45);
    // Three empty chairs
    tl.fromTo(".hk-slot", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)", stagger: 0.14 }, 2.1);
    tl.fromTo("#hk-slots", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.1);
    tl.to(".hk-slot", { opacity: 0.3, duration: 0.18, yoyo: true, repeat: 7, ease: "none", stagger: 0.12 }, 3.0);
    window.__timelines["hook"] = tl;
